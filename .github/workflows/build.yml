name: Build Kubra Ultron Master Suite

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies & PyAudio Fix
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install pipwin
        pipwin install pyaudio
        pip install pyttsx3 SpeechRecognition requests pyautogui wikipedia comtypes pypiwin32 psutil

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconsole --onefile ultron_omega_gui.py

    - name: Upload Compiled EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kubra-Ultron-Master-Supreme-EXE
        path: dist/ultron_omega_gui.exe
        
